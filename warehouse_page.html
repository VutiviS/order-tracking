<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#052B63">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Warehouse">
<meta name="robots" content="noindex">
<link rel="manifest" href="/warehouse_manifest.json">
<title>Warehouse · {{COMPANY}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  picture { display:flex; flex:none; align-items:center; }
  :root { --navy:#052B63; --green:#2F8F2A; --red:#B42318; --amber:#B45309; --bg:#EEF1F6; --card:#FFFFFF; --ink:#0F172A;
          --muted:#5B6474; --line:#D9DFE8; --soft:#E8EDF4; --err-bg:#FBEAE8; --err-ink:#8A1C12; --ok-bg:#EAF4E3; --ok-ink:#2F6B16;
          --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0A0F1A; --card:#111827; --ink:#E5E9F0; --muted:#94A0B4; --line:#243044; --soft:#1A2436;
            --err-bg:#2E1513; --err-ink:#F5A39A; --ok-bg:#15281A; --ok-ink:#93D46E; }
  }
  * { box-sizing:border-box; border-radius:0; -webkit-tap-highlight-color:transparent; }
  html, body { overflow-x:hidden; overflow-x:clip; max-width:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--font); min-height:100vh; }
  button, input { font:inherit; color:inherit; }
  .hidden { display:none !important; }
  .bar { background:var(--navy); color:#fff; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; }
  .bar .in { max-width:600px; margin:0 auto; display:flex; align-items:center; gap:10px; }
  .bar img { height:34px; } .bar .t { flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar button { background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff; padding:6px 10px; font-size:13px; }
  main { max-width:600px; margin:0 auto; padding:12px 12px 40px; }
  .card { background:var(--card); border:1px solid var(--line); padding:14px; margin-bottom:10px; }
  h2 { margin:0 0 6px; font-size:18px; } h3 { margin:0 0 8px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .sub { color:var(--muted); font-size:13px; margin:0 0 8px; }
  label { display:block; font-size:13px; font-weight:600; margin:10px 0 6px; }
  input { width:100%; border:1px solid var(--line); background:var(--card); padding:12px; font-size:16px; }
  .btn { display:block; width:100%; border:0; background:var(--navy); color:#fff; font-weight:600; padding:14px; margin-top:10px; font-size:16px; cursor:pointer; }
  .btn.green { background:var(--green); } .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn[disabled] { opacity:.6; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { background:var(--card); border:1px solid var(--line); padding:18px 14px; text-align:left; cursor:pointer; min-height:110px; }
  .tile b { display:block; font-size:16px; } .tile span { color:var(--muted); font-size:13px; }
  /* the menu: a coloured icon per job, a light lift when pressed */
  .tile { position:relative; overflow:hidden; display:flex; flex-direction:column; gap:4px; min-height:132px;
          box-shadow:0 1px 2px rgba(15,23,42,.05),0 14px 28px -18px rgba(15,23,42,.3); transition:transform .12s, box-shadow .12s; }
  .tile:active { transform:scale(.97); }
  .tile::after { content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--c); opacity:.9; }
  .tile .ico { width:42px; height:42px; display:grid; place-items:center; background:var(--c); color:#fff; margin-bottom:8px;
               box-shadow:0 8px 16px -8px var(--c); }
  .tile .ico svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .hello { margin:6px 2px 14px; } .hello small { display:block; font-size:11px; font-weight:700; letter-spacing:.16em;
           text-transform:uppercase; color:var(--green); } .hello b { font-size:22px; letter-spacing:-.01em; }
  .hello span { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  .scan { display:flex; gap:8px; } .scan input { flex:1; } .scan button { width:auto; margin:0; padding:0 14px; }
  .msg { padding:10px 12px; margin:10px 0; font-size:14px; } .msg.err { background:var(--err-bg); color:var(--err-ink); }
  .msg.ok { background:var(--ok-bg); color:var(--ok-ink); }
  .row { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; } .row .w { font-size:12px; color:var(--muted); }
  .row.done b { color:var(--green); } .qty { font-weight:700; font-size:18px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .step { display:flex; gap:6px; align-items:center; } .step button { width:40px; height:40px; border:1px solid var(--line); background:var(--card); font-size:18px; }
  .list .row { cursor:pointer; }
  #cam { position:fixed; inset:0; background:#000; z-index:50; display:flex; flex-direction:column; }
  #cam video { flex:1; width:100%; object-fit:cover; } #cam .frame { position:absolute; left:10%; right:10%; top:35%; height:22%; border:3px solid #5DB032; }
  #cam button { margin:0; } #cam .hint { color:#fff; text-align:center; padding:10px; }
  @media (max-width:360px) { .tiles { grid-template-columns:1fr; } }
  /* the bin view */
  .binhead { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; } .binhead h2 { font-size:26px; margin:0; }
  .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:10px; }
  .stat { border:1px solid var(--line); padding:8px 10px; border-top:3px solid var(--navy); min-width:0; }
  .stat b { display:block; font-size:20px; font-variant-numeric:tabular-nums; } .stat span { font-size:11px; color:var(--muted); }
  .stat.ok { border-top-color:var(--green); } .stat.warn { border-top-color:var(--amber); } .stat.bad { border-top-color:var(--red); }
  .prod { border-top:1px solid var(--line); padding:10px 0; } .prod:first-of-type { border-top:0; }
  .prod .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .prod .nums { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:6px; font-size:12px; color:var(--muted); }
  .prod .nums b { display:block; color:var(--ink); font-size:15px; font-variant-numeric:tabular-nums; }
  .chip { display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; margin-top:6px; background:var(--soft); }
  .chip.expired { background:var(--err-bg); color:var(--err-ink); } .chip.expiring { background:#FEF3C7; color:#92400E; }
  .chip.ok { background:var(--ok-bg); color:var(--ok-ink); }
  @media (prefers-color-scheme: dark) { .chip.expiring { background:#3A2A0C; color:#FCD34D; } }
  .mv { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
  .mv:first-of-type { border-top:0; } .mv .w { font-size:12px; color:var(--muted); } .mv .q { font-weight:700; white-space:nowrap; }
  .mv .q.in { color:var(--green); }
  .seg { display:flex; border:1px solid var(--line); } .seg button { flex:1; border:0; background:var(--card); padding:10px 6px; font-size:13px; cursor:pointer; }
  .seg button.on { background:var(--navy); color:#fff; font-weight:600; }
  select { width:100%; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:12px; font:inherit; font-size:16px; }
  .pick { max-height:45vh; overflow:auto; border:1px solid var(--line); margin-top:8px; }
  .pick label { display:flex; gap:10px; align-items:center; margin:0; padding:10px; border-top:1px solid var(--line); font-weight:400; }
  .pick label:first-child { border-top:0; } .pick input { width:auto; } .pick .w { font-size:12px; color:var(--muted); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
</style>
</head>
<body>
<header class="bar"><div class="in">
  <picture><source media="(max-width:400px)" srcset="/favicon.svg"><img src="/logo.svg" alt="" onerror="this.remove()"></picture>
  <div class="t" id="title">Warehouse</div>
  <button id="home" class="hidden" type="button">Menu</button>
  <button id="out" class="hidden" type="button">Sign out</button>
</div></header>
<main>
  <div class="msg ok hidden" id="ok"></div>
  <div class="msg err hidden" id="err"></div>
  <section id="v-login" class="card">
    <h2>Warehouse sign-in</h2>
    <p class="sub">Your INVENTRA username and password.</p>
    <label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="off" spellcheck="false" enterkeyhint="next">
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" enterkeyhint="go">
    <button class="btn" id="go" type="button">Sign in</button>
  </section>
  <section id="v-menu" class="hidden"><div class="hello" id="hello"></div><div class="tiles" id="tiles"></div></section>
  <section id="v-work" class="hidden"></section>
</main>
<div id="cam" class="hidden"><video id="video" playsinline muted></video><div class="frame"></div>
  <div class="hint">Point at the barcode</div><button class="btn ghost" id="camClose" style="color:#fff;border-color:#fff">Close camera</button></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token = localStorage.getItem("inventra_wh") || "", me = JSON.parse(localStorage.getItem("inventra_wh_me") || "{}");
const MODES = {pick: ["Pick & pack", "Orders waiting to go out"], receive: ["Goods received", "Check a delivery against its order"],
               move: ["Put away / move", "Put stock in a bin or move it"], count: ["Count a bin", "Count what is in a bin"],
               lookup: ["Look up", "Scan anything: what and where is it?"],
               bin: ["Scan a bin", "What is in it: binned, dispatched, available, expiring"],
               labels: ["Bin labels", "Print bin numbers and barcodes"]};
// each job's colour and picture on the menu
const LOOKS = {
  pick: ["#2563EB", '<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>'],
  receive: ["#16A34A", '<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>'],
  move: ["#0891B2", '<path d="M4 4h16v6H4zM4 14h16v6H4z"/><path d="M12 7v10M9 14l3 3 3-3"/>'],
  count: ["#7C3AED", '<path d="M5 3h14v18H5z"/><path d="M9 8h6M9 12h6M9 16h3"/>'],
  lookup: ["#EA8A0C", '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>'],
  bin: ["#475569", '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M14 8v8M17 8v8"/>'],
  labels: ["#DB2777", '<path d="M3 3h9l9 9-9 9-9-9z"/><circle cx="8" cy="8" r="1.5"/>']};
const EVERYONE = ["lookup", "bin", "labels"];           // every signed-in person may look up, scan bins, print labels

function say(t, bad) { const m = $(bad ? "err" : "ok"); $(bad ? "ok" : "err").classList.add("hidden"); m.textContent = t; m.classList.remove("hidden"); if (!bad) setTimeout(() => m.classList.add("hidden"), 4000); window.scrollTo(0, 0); }
function clear() { $("ok").classList.add("hidden"); $("err").classList.add("hidden"); }
function view(v) { ["login", "menu", "work"].forEach(x => $("v-" + x).classList.toggle("hidden", x !== v)); $("home").classList.toggle("hidden", v !== "work"); $("out").classList.toggle("hidden", v === "login"); }
async function api(path, body) {
  const r = await fetch("/api/wh/" + path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(Object.assign({token}, body || {}))});
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { localStorage.removeItem("inventra_wh"); token = ""; view("login"); }
  if (!r.ok) { const e = new Error(d.error || "No connection. Try again."); e.status = r.status; throw e; }
  return d;
}
function beep(ok) { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.frequency.value = ok ? 880 : 220; o.connect(a.destination); o.start(); setTimeout(() => { o.stop(); a.close(); }, ok ? 90 : 300); } catch (e) {} if (navigator.vibrate) navigator.vibrate(ok ? 40 : [80, 60, 80]); }

// ---- scanning: a box (typing or a USB / Bluetooth scanner) plus the phone camera ----
let onScan = null, stream = null, zx = null;
function scanBox(placeholder) {
  return `<div class="scan"><input id="code" placeholder="${esc(placeholder)}" autocomplete="off" autocapitalize="characters" enterkeyhint="go">
          <button class="btn" type="button" onclick="camera()">Camera</button></div>`;
}
function wireScan(fn) {
  onScan = fn;
  const box = $("code"); if (!box) return;
  box.onkeydown = e => { if (e.key === "Enter" && box.value.trim()) { const v = box.value.trim(); box.value = ""; fn(v); } };
  setTimeout(() => box.focus(), 50);
}
let zxCtl = null, scanning = false;
const ZXING_SRC = "https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js";
const ZXING_SRI = "sha384-ylLhng89kD62+PVK1cjm4rAYg69zDlGrbbSfAE2Eb8Xqf8RoAQCMcRoUXZh7pAPC";
function loadZxing() {
  if (window.ZXingBrowser) return Promise.resolve();
  return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = ZXING_SRC; s.integrity = ZXING_SRI;
    s.crossOrigin = "anonymous"; s.onload = ok; s.onerror = () => bad(new Error("scanner")); document.head.appendChild(s); });
}
function found(text) { if (!scanning) return; closeCam(); onScan && onScan(text); }
async function camera() {
  scanning = true;
  $("cam").classList.remove("hidden");
  const video = $("video");
  video.setAttribute("playsinline", ""); video.muted = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { closeCam(); return say("This browser can't use the camera: use Chrome (Android) or Safari (iPhone), or type the code.", true); }
  try {
    // the BACK camera, sharp enough for small labels; Android's own reader when it reads QR codes, otherwise ZXing
    stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: "environment"}, width: {ideal: 1920}, height: {ideal: 1080}}});
    try { await stream.getVideoTracks()[0].applyConstraints({advanced: [{focusMode: "continuous"}]}); } catch (e) {}
    let formats = [];
    if ("BarcodeDetector" in window) { try { formats = await BarcodeDetector.getSupportedFormats(); } catch (e) {} }
    if (formats.includes("qr_code")) {
      video.srcObject = stream; await video.play();
      const det = new BarcodeDetector({formats: ["qr_code", "code_128", "code_39", "ean_13", "ean_8", "upc_a", "data_matrix"].filter(x => formats.includes(x))});
      const tick = async () => { if (!scanning) return;
        if (video.readyState >= 2) { try { const f = await det.detect(video); if (f.length && f[0].rawValue) return found(f[0].rawValue); } catch (e) {} }
        setTimeout(tick, 120); };
      tick();
    } else {
      await loadZxing(); if (!scanning) return;
      zxCtl = await new ZXingBrowser.BrowserMultiFormatReader().decodeFromStream(stream, video, res => { if (res) found(res.getText()); });
    }
  } catch (e) {
    closeCam(); const n = (e && e.name) || "";
    say(n === "NotAllowedError" ? (/iphone|ipad|ipod/i.test(navigator.userAgent) ? "Camera blocked. iPhone: Settings > Safari > Camera > Allow, then try again."
        : "Camera blocked. Tap the lock next to the address > Permissions > Camera > Allow, then try again.")
      : e && e.message === "scanner" ? "The scanner couldn't load (check the internet), or type the code." : "The camera can't be used right now, or type the code.", true);
  }
}
function closeCam() { scanning = false; $("cam").classList.add("hidden"); if (zxCtl) { try { zxCtl.stop(); } catch (e) {} zxCtl = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } try { $("video").srcObject = null; } catch (e) {} }$("camClose").onclick = closeCam;

// ---- sign in, menu ----
$("go").onclick = async () => {
  clear();
  if (!$("u").value.trim() || !$("p").value) { say("Type your username and password.", true); return; }
  const go = $("go"); go.disabled = true; go.textContent = "Signing in…";      // (no second tap while it checks)
  try { const d = await api("login", {username: $("u").value.trim(), password: $("p").value}); token = d.token; me = d;
        localStorage.setItem("inventra_wh", token); localStorage.setItem("inventra_wh_me", JSON.stringify({name: d.name, can: d.can}));
        $("p").value = ""; menu(); }
  catch (e) { say(e.message, true); }
  finally { go.disabled = false; go.textContent = "Sign in"; }
};
$("u").onkeydown = e => { if (e.key === "Enter") $("p").focus(); };
$("p").onkeydown = e => { if (e.key === "Enter") $("go").click(); };
$("out").onclick = () => { localStorage.removeItem("inventra_wh"); token = ""; view("login"); };
$("home").onclick = () => { closeCam(); menu(); };
function menu() {
  $("title").textContent = "Warehouse";
  const can = (me.can || []).concat(EVERYONE);
  const h = new Date().getHours(), first = (me.name || "").split(" ")[0];
  $("hello").innerHTML = `<small>${h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"}</small><b></b><span>What are you working on?</span>`;
  $("hello").querySelector("b").textContent = first ? first : "Warehouse";
  $("tiles").innerHTML = Object.entries(MODES).filter(([k]) => can.includes(k)).map(([k, [t, s]]) => {
    const [c, ico] = LOOKS[k] || ["#052B63", ""];
    return `<button class="tile" type="button" style="--c:${c}" onclick="open_('${k}')"><span class="ico"><svg viewBox="0 0 24 24">${ico}</svg></span><b>${t}</b><span>${s}</span></button>`;
  }).join("");
  view("menu");
}
function open_(k) { clear(); $("title").textContent = MODES[k][0]; view("work"); ({pick, receive, move, count, lookup, bin, labels})[k](); }

// ---- look up ----
function lookup() {
  $("v-work").innerHTML = `<div class="card">${scanBox("Scan or type a product, serial or bin")}</div><div id="res"></div>`;
  wireScan(async code => {
    try { const d = await api("lookup", {code}); beep(true);
      if (d.type === "bin") { showBin(await api("bin", {code: d.bin})); return; }   // a bin label: the full bin view
      $("res").innerHTML = `<div class="card"><h3>${esc(d.type)}</h3><h2>${esc(d.description || d.bin)}</h2>` +
        (d.type === "bin" ? (d.holds.length ? d.holds.map(h => `<div class="row"><span>${esc(h.description)}</span><span class="qty">${h.qty}</span></div>`).join("") : `<p class="sub">Empty</p>`)
          : `<p class="sub">${esc(d.sku)}${d.serial ? " · serial " + esc(d.serial) + (d.in_stock ? " · in stock" : " · NOT in stock") : ""}</p>
             <div class="row"><span>On hand</span><span class="qty">${d.on_hand}</span></div><div class="row"><span>Where</span><span>${esc(d.where)}</span></div>`) + `</div>`;
    } catch (e) { beep(false); say(e.message, true); }
  });
}

// ---- scan a bin: what is in it, binned, dispatched, available now, expiring soon, and its movements ----
const fmtN = v => (Math.round((+v || 0) * 100) / 100).toLocaleString();
function bin() {
  $("v-work").innerHTML = `<div class="card">${scanBox("Scan the bin label, or type the bin code")}
    <p class="sub" style="margin:8px 0 0">Tap Camera and point it at the barcode or the QR code on the bin label.</p></div><div id="res"></div>`;
  wireScan(async code => {
    try { showBin(await api("bin", {code})); beep(true); }
    catch (e) { beep(false); say(e.message, true); }
  });
}
function fmtDate(iso) { if (!iso) return ""; const d = new Date(iso + "T00:00:00"); return isNaN(d) ? iso : d.toLocaleDateString(undefined, {day: "numeric", month: "short", year: "numeric"}); }
function expiryText(p) {
  if (!p.expiry) return p.available > 0 ? "No expiry date" : "";
  let t = "Expires " + fmtDate(p.expiry);
  if (p.expiry_days != null && p.available > 0) t += p.expiry_days < 0 ? ` (${-p.expiry_days} days ago)` : p.expiry_days === 0 ? " (today)" : ` (in ${p.expiry_days} days)`;
  return t + (p.expiry_source === "product" ? " · product's earliest date" : "");
}
function showBin(d) {
  clear();
  const b = d.bin, t = d.totals;
  const about = [b.zone ? "Zone " + b.zone : "", b.description || "", b.active ? "" : "Inactive bin"].filter(Boolean).join(" · ");
  const prods = d.products.map(p => `<div class="prod"><div class="top"><div><b>${esc(p.description)}</b><div class="w sub" style="margin:0">${esc(p.sku)}</div></div>
      <div style="text-align:right"><span class="qty">${fmtN(p.available)}</span><div class="w sub" style="margin:0">available now</div></div></div>
      <div class="nums"><div><b>${fmtN(p.binned)}</b>binned</div><div><b>${fmtN(p.moved_out)}</b>moved out</div><div><b>${fmtN(p.dispatched)}</b>dispatched</div></div>
      ${p.available > 0 ? `<span class="chip ${esc(p.status)}">${esc(p.status_text)}${p.expired_qty ? " · " + fmtN(p.expired_qty) + " expired" : ""}${p.expiring_qty ? " · " + fmtN(p.expiring_qty) + " expiring soon" : ""}</span>` : `<span class="chip">Nothing left in this bin</span>`}
      ${expiryText(p) ? `<div class="w sub" style="margin:4px 0 0">${esc(expiryText(p))}</div>` : ""}</div>`).join("");
  const moves = d.history.slice(0, 60).map(h => `<div class="mv"><div><b>${esc(h.movement)}</b> · ${esc(h.description)}<div class="w">${esc(h.when || "—")}${h.detail ? " · " + esc(h.detail) : ""}</div></div>
      <span class="q ${h.qty > 0 ? "in" : ""}">${h.qty > 0 ? "+" : "−"}${fmtN(Math.abs(h.qty))}</span></div>`).join("");
  $("res").innerHTML = `<div class="card"><h3>Bin</h3><div class="binhead"><h2>${esc(b.code)}</h2></div>${about ? `<p class="sub" style="margin:2px 0 0">${esc(about)}</p>` : ""}
      <div class="stats">
        <div class="stat ok"><b>${fmtN(t.available)}</b><span>available now</span></div>
        <div class="stat"><b>${fmtN(t.products)}</b><span>products</span></div>
        <div class="stat"><b>${fmtN(t.binned)}</b><span>binned</span></div>
        <div class="stat"><b>${fmtN(t.dispatched)}</b><span>dispatched</span></div>
        <div class="stat warn"><b>${fmtN(t.expiring)}</b><span>expiring ≤ ${d.warn_days} days</span></div>
        <div class="stat bad"><b>${fmtN(t.expired)}</b><span>expired</span></div></div>
      <p class="sub" style="margin:8px 0 0">As of ${esc(d.as_of)} · ready for the next scan</p></div>
    <div class="card"><h3>In this bin</h3>${prods || `<p class="sub">Nothing has been put in this bin yet</p>`}</div>
    <div class="card"><h3>Movements</h3>${moves || `<p class="sub">No movements recorded</p>`}
      <p class="sub" style="margin:8px 0 0">Dispatched = units that left the warehouse from this bin (oldest stock first).</p></div>
    <button class="btn ghost" type="button" onclick="labels(['${esc(b.code)}'])">Print this bin's label</button>`;
}

// ---- bin labels: the bin code, a barcode and a QR code, as a PDF to print or share ----
let binList = [], lblMode = "all", lblUrl = "";
async function labels(only) {
  $("title").textContent = MODES.labels[0]; view("work"); clear();
  $("v-work").innerHTML = `<div class="card">Loading the bins…</div>`;
  try { binList = (await api("bins")).list || []; } catch (e) { return say(e.message, true); }
  const zones = [...new Set(binList.map(b => b.zone).filter(Boolean))].sort();
  lblMode = only ? "pick" : "all";
  $("v-work").innerHTML = `<div class="card"><h3>Which bins</h3>
      <div class="seg" id="lseg"><button type="button" data-m="all">All bins</button><button type="button" data-m="zone">A zone</button><button type="button" data-m="pick">Choose</button></div>
      <div id="lzone" class="hidden"><label for="lz">Zone</label><select id="lz">${zones.length ? zones.map(z => `<option>${esc(z)}</option>`).join("") : `<option value="">No zones yet</option>`}</select></div>
      <div id="lpick" class="hidden"><input id="lfind" placeholder="Find a bin" style="margin-top:10px" autocomplete="off">
        <div class="pick" id="lbins">${binList.map(b => `<label data-k="${esc((b.code + " " + b.zone + " " + b.description).toLowerCase())}"><input type="checkbox" value="${esc(b.code)}" ${only && only.includes(b.code) ? "checked" : ""}>
          <div><b>${esc(b.code)}</b><div class="w">${esc([b.zone ? "Zone " + b.zone : "", b.description, b.active ? "" : "inactive"].filter(Boolean).join(" · "))}</div></div></label>`).join("") || `<p class="sub" style="padding:10px">No bins yet</p>`}</div></div>
      <p class="sub" id="lcount" style="margin:8px 0 0"></p></div>
    <div class="card"><h3>Label size</h3><select id="lsize">
        <option value="sheet">21 per A4 sheet (Avery L7160)</option><option value="shelf">8 per A4 sheet (Avery L7165)</option><option value="sign">2 big signs per A4 page</option></select>
      <div class="two"><div><label for="lcopies">Labels per bin</label><input id="lcopies" inputmode="numeric" value="1"></div>
        <div><label for="lskip">Already used on the sheet</label><input id="lskip" inputmode="numeric" value="0"></div></div>
      <button class="btn green" id="lmake" type="button">Make the labels (PDF)</button>
      <div id="lout"></div>
      <p class="sub" style="margin:8px 0 0">Each label has the bin code, a barcode (any scanner) and a QR code (phone camera). Print from the PDF, or share it to a printer app.</p></div>`;
  const setMode = m => { lblMode = m; [...$("lseg").children].forEach(x => x.classList.toggle("on", x.dataset.m === m));
    $("lzone").classList.toggle("hidden", m !== "zone"); $("lpick").classList.toggle("hidden", m !== "pick"); lcount(); };
  [...$("lseg").children].forEach(x => x.onclick = () => setMode(x.dataset.m));
  $("lfind").oninput = () => { const q = $("lfind").value.trim().toLowerCase(); [...$("lbins").querySelectorAll("label")].forEach(l => l.classList.toggle("hidden", q && !l.dataset.k.includes(q))); };
  $("lbins").onchange = lcount; $("lz").onchange = lcount;
  $("lmake").onclick = makeLabels;
  setMode(lblMode);
}
function chosenBins() { return [...$("lbins").querySelectorAll("input:checked")].map(x => x.value); }
function lcount() {
  const k = lblMode === "all" ? binList.filter(b => b.active).length : lblMode === "zone" ? binList.filter(b => b.active && b.zone === $("lz").value).length : chosenBins().length;
  $("lcount").textContent = `${k} bin${k === 1 ? "" : "s"} chosen`;
}
async function makeLabels() {
  clear();
  const body = {size: $("lsize").value, copies: $("lcopies").value, skip: $("lskip").value};
  if (lblMode === "zone") body.zone = $("lz").value;
  if (lblMode === "pick") { body.codes = chosenBins(); if (!body.codes.length) return say("Tick the bins to print.", true); }
  $("lmake").disabled = true; $("lmake").textContent = "Making the labels…";
  try {
    const r = await fetch("/api/wh/labels", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(Object.assign({token}, body))});
    if (r.status === 401) { localStorage.removeItem("inventra_wh"); token = ""; return view("login"); }
    if (!r.ok) { let d = {}; try { d = await r.json(); } catch (e) {} throw new Error(d.error || "The labels couldn't be made. Try again."); }
    const blob = await r.blob();
    const name = ((r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/) || [])[1] || "Bin labels.pdf";
    if (lblUrl) URL.revokeObjectURL(lblUrl);
    lblUrl = URL.createObjectURL(blob);
    const file = new File([blob], name, {type: "application/pdf"});
    const canShare = navigator.canShare && navigator.canShare({files: [file]});
    $("lout").innerHTML = `<a class="btn" href="${lblUrl}" target="_blank" rel="noopener" download="${esc(name)}">Open the labels to print</a>` +
      (canShare ? `<button class="btn ghost" type="button" id="lshare">Share (printer app, e-mail, WhatsApp…)</button>` : "");
    if (canShare) $("lshare").onclick = () => navigator.share({files: [file], title: name}).catch(() => {});
    beep(true); say("The labels are ready.");
  } catch (e) { beep(false); say(e.message, true); }
  finally { $("lmake").disabled = false; $("lmake").textContent = "Make the labels (PDF)"; }
}

// ---- pick & pack ----
let orders = [], cur = null, picked = {};
async function pick() {
  $("v-work").innerHTML = `<div class="card"><h3>Orders waiting to go out</h3><div class="list" id="ol">Loading…</div></div>`;
  try { orders = (await api("orders")).orders;
        $("ol").innerHTML = orders.length ? orders.map(o => `<div class="row" onclick="pickOrder('${esc(o.order_id)}')"><div><b>${esc(o.client)}</b>
          <div class="w">Order ${esc(o.order_id)} · ${esc(o.date)} · ${o.items.length} line(s)${o.packed ? " · PACKED" : ""}</div></div><span>›</span></div>`).join("") : "Nothing waiting 🎉";
  } catch (e) { say(e.message, true); }
}
function pickOrder(id) {
  cur = orders.find(o => o.order_id === id); picked = {};
  cur.items.forEach(i => picked[i.sku] = {qty: 0, serials: []});
  $("title").textContent = cur.client;
  $("v-work").innerHTML = `<div class="card"><h2>${esc(cur.client)}</h2><p class="sub">Order ${esc(cur.order_id)}</p>${scanBox("Scan each product or serial number")}</div>
    <div class="card" id="pl"></div><div class="card"><label for="pnote">Note (optional)</label><input id="pnote">
    <button class="btn green" id="packed" type="button">Packed</button></div>`;
  paintPick();
  wireScan(async code => {
    try { const d = await api("lookup", {code});
      const line = cur.items.find(i => i.sku === d.sku);
      if (!line) { beep(false); return say(`${d.description} isn't on this order.`, true); }
      const p = picked[line.sku];
      if (d.type === "serial") {
        if (!d.in_stock) { beep(false); return say(`Serial ${d.serial} isn't in stock.`, true); }
        if (p.serials.includes(d.serial)) { beep(false); return say(`Serial ${d.serial} is already scanned.`, true); }
        p.serials.push(d.serial); p.qty = p.serials.length;
      } else if (line.serialized) { beep(false); return say(`${line.description} has serial numbers: scan the serial, not the product.`, true); }
      else p.qty += 1;
      if (p.qty > line.qty) { beep(false); say(`Too many: the order needs ${line.qty} of ${line.description}.`, true); } else { beep(true); clear(); }
      paintPick();
    } catch (e) { beep(false); say(e.message, true); }
  });
  $("packed").onclick = () => sendPick(false);
}
function paintPick() {
  $("pl").innerHTML = `<h3>Pick list</h3>` + cur.items.map(i => { const p = picked[i.sku]; const done = p.qty === i.qty;
    return `<div class="row ${done ? "done" : ""}"><div><b>${esc(i.description)}</b><div class="w">${esc(i.where)}${i.serialized ? " · scan serials" : ""}</div>${i.fefo ? `<div class="w" style="color:#B45309;font-weight:600">${esc(i.fefo)}</div>` : ""}
      ${p.serials.length ? `<div class="w">${p.serials.map(esc).join(", ")}</div>` : ""}</div>
      <div class="step">${i.serialized ? "" : `<button onclick="adj('${esc(i.sku)}',-1)">−</button>`}<span class="qty">${p.qty} / ${i.qty}</span>${i.serialized ? "" : `<button onclick="adj('${esc(i.sku)}',1)">+</button>`}</div></div>`; }).join("");
}
function adj(sku, d) { const p = picked[sku]; p.qty = Math.max(0, p.qty + d); paintPick(); }
async function sendPick(accept) {
  const lines = Object.entries(picked).map(([sku, p]) => ({sku, qty: p.qty, serials: p.serials}));
  try { const d = await api("pick", {order_id: cur.order_id, lines, note: $("pnote").value, accept_short: accept}); beep(true); say(d.message); pick(); }
  catch (e) { if (e.status === 409 && confirm(e.message + "\n\nSend it as packed anyway (the office will see the differences)?")) sendPick(true); else say(e.message, true); }
}

// ---- goods received ----
let po = null, got = {};
function receive() {
  $("v-work").innerHTML = `<div class="card"><label for="po">Purchase order number</label><div class="scan"><input id="po" autocapitalize="characters" placeholder="e.g. PO-2610-0042"><button class="btn" type="button" id="poGo">Open</button></div></div><div id="rw"></div>`;
  $("poGo").onclick = async () => {
    try { po = await api("po", {po: $("po").value}); got = {}; po.lines.forEach(l => got[l.sku] = {qty: 0, damaged: 0, serials: []}); paintReceive(); }
    catch (e) { say(e.message, true); }
  };
}
function paintReceive() {
  $("rw").innerHTML = `<div class="card"><h2>${esc(po.po)} · ${esc(po.supplier)}</h2>${scanBox("Scan each item as you unpack")}</div>
    <div class="card"><h3>Expected</h3>${po.lines.map(l => { const g = got[l.sku] || {qty: 0, damaged: 0, serials: []};
      return `<div class="row ${g.qty === l.open ? "done" : ""}"><div><b>${esc(l.description)}</b><div class="w">${g.damaged ? g.damaged + " damaged · " : ""}${g.serials.map(esc).join(", ")}</div></div>
      <div class="step"><button onclick="radj('${esc(l.sku)}',-1)">−</button><span class="qty">${g.qty} / ${l.open}</span><button onclick="radj('${esc(l.sku)}',1)">+</button>
      <button title="damaged" onclick="rdam('${esc(l.sku)}')">!</button></div></div>`; }).join("")}</div>
    <div class="card"><label for="rnote">Note (optional)</label><input id="rnote"><button class="btn green" id="rsend">Delivery checked</button></div>`;
  wireScan(async code => {
    try { const d = await api("lookup", {code}); const g = got[d.sku] || (got[d.sku] = {qty: 0, damaged: 0, serials: []});
      if (d.serial) { if (g.serials.includes(d.serial)) { beep(false); return say("Already scanned.", true); } g.serials.push(d.serial); }
      g.qty += 1; beep(!!po.lines.find(l => l.sku === d.sku)); if (!po.lines.find(l => l.sku === d.sku)) say(`${d.description} isn't on this order.`, true); paintReceive();
    } catch (e) { beep(false); say(e.message, true); }
  });
  $("rsend").onclick = async () => { try { const d = await api("receive", {po: po.po, lines: Object.entries(got).map(([sku, g]) => Object.assign({sku}, g)), note: $("rnote").value});
    beep(true); say(d.message + (d.differences.length ? " " + d.differences.join("; ") : "")); receive(); } catch (e) { say(e.message, true); } };
}
function radj(sku, d) { const g = got[sku]; g.qty = Math.max(0, g.qty + d); paintReceive(); }
function rdam(sku) { const n = prompt("How many of these are damaged?", got[sku].damaged || 1); if (n !== null) { got[sku].damaged = Math.max(0, +n || 0); paintReceive(); } }

// ---- put away / move ----
let mv = {};
function move() {
  mv = {};
  $("v-work").innerHTML = `<div class="card"><h3>1 · Scan the product or serial</h3>${scanBox("Product or serial")}<div id="mvp" class="sub"></div>
    <label for="mfrom">From bin (empty = not in a bin yet)</label><input id="mfrom" autocapitalize="characters">
    <label for="mqty">How many</label><input id="mqty" inputmode="numeric" value="1">
    <label for="mto">To bin (scan the bin label)</label><input id="mto" autocapitalize="characters">
    <button class="btn green" id="msave">Save</button></div>`;
  wireScan(async code => { try { const d = await api("lookup", {code});
      if (d.type === "bin") { $("mto").value = d.bin; beep(true); return; }
      mv.code = code; $("mvp").textContent = `${d.description} · ${d.where}` + (d.serial ? ` · serial ${d.serial}` : ""); if (d.serial) $("mqty").value = 1; beep(true);
    } catch (e) { beep(false); say(e.message, true); } });
  $("msave").onclick = async () => { if (!mv.code) return say("Scan the product first.", true);
    try { const d = await api("move", {code: mv.code, qty: $("mqty").value, from_bin: $("mfrom").value, to_bin: $("mto").value}); beep(true); say(d.message); move(); }
    catch (e) { beep(false); say(e.message, true); } };
}

// ---- count a bin ----
let cbin = "", counts = {}, names = {};
function count() {
  cbin = ""; counts = {}; names = {};
  $("v-work").innerHTML = `<div class="card"><h3 id="ch">1 · Scan the bin</h3>${scanBox("Bin, then each item in it")}</div><div class="card" id="cl"></div>
    <div class="card"><button class="btn green" id="csend">Count done</button></div>`;
  paintCount();
  wireScan(async code => { try { const d = await api("lookup", {code});
      if (d.type === "bin") { cbin = d.bin; counts = {}; $("ch").textContent = "Bin " + d.bin + " · now scan each item"; beep(true); paintCount(); return; }
      if (!cbin) { beep(false); return say("Scan the bin first.", true); }
      counts[d.sku] = (counts[d.sku] || 0) + 1; names[d.sku] = d.description; beep(true); paintCount();
    } catch (e) { beep(false); say(e.message, true); } });
  $("csend").onclick = async () => { if (!cbin) return say("Scan the bin first.", true);
    if (!confirm(`Finish the count of ${cbin}? Anything not scanned counts as zero.`)) return;
    try { const d = await api("count", {bin: cbin, counts}); beep(true); say(d.message + (d.differences.length ? " " + d.differences.join("; ") : "")); count(); }
    catch (e) { say(e.message, true); } };
}
function paintCount() {
  $("cl").innerHTML = `<h3>Counted</h3>` + (Object.keys(counts).length ? Object.entries(counts).map(([sku, n]) =>
    `<div class="row"><span>${esc(names[sku] || sku)}</span><div class="step"><button onclick="cadj('${esc(sku)}',-1)">−</button><span class="qty">${n}</span><button onclick="cadj('${esc(sku)}',1)">+</button></div></div>`).join("") : `<p class="sub">Nothing yet</p>`);
}
function cadj(sku, d) { counts[sku] = Math.max(0, (counts[sku] || 0) + d); paintCount(); }

if (token && me.can) {
  menu();
  const go = new URLSearchParams(location.search).get("open");      // the home-screen shortcuts (Scan a bin, Bin labels)
  if (go && MODES[go] && (me.can || []).concat(EVERYONE).includes(go)) open_(go);
} else view("login");
</script>

<script id="ik-script" data-offline="on" data-install="on" data-app="Warehouse" data-hero="warehouse" data-hero-in="#v-login">
(function () {
  "use strict";
  var cfg = (document.currentScript && document.currentScript.dataset) || {};

    pill.lastChild.textContent = text;
    if (action) { var b = el("button"); b.type = "button"; b.textContent = action[0]; b.onclick = action[1]; pill.appendChild(b); }
    if (ms) pillTimer = setTimeout(function () { pill.classList.add("ik-hide"); }, ms);

    var share = '<svg class="ik-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';

    sheet.querySelector("b").textContent = "Add " + APP + " to your home screen";
    sheet.querySelector("p").innerHTML = deferred
      ? "It opens straight away, full screen, like any other app. No app store, nothing to pay."
      : "Tap " + share + " <b style='display:inline;font-size:inherit'>Share</b> at the bottom of Safari, then <b style='display:inline;font-size:inherit'>Add to Home Screen</b>.";
    var btns = sheet.querySelector(".ik-btns");
    var close = function () { sheet.classList.add("ik-hide"); setTimeout(function () { sheet.remove(); }, 300); };
    var no = el("button"); no.type = "button"; no.textContent = deferred ? "Not now" : "OK";
    no.onclick = function () { store(KEY, String(Date.now())); close(); };
    btns.appendChild(no);
    if (deferred) {

  // ---- show / hide on password boxes ----
  var EYE = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function eyes(root) {
    (root || document).querySelectorAll('input[type="password"]').forEach(function (inp) {
      if (inp.dataset.ikEye || inp.closest(".ik-pw")) return;

  var ART = {

      '<path d="M18 112V12M142 112V12M18 42h124M18 77h124M18 112h124"/></g><g fill="#fff">' +

      '<rect x="26" y="55" width="36" height="22" opacity=".65"/><rect class="ik-bob" x="70" y="59" width="24" height="18" fill="#7AC143"/><rect x="102" y="53" width="28" height="24" opacity=".55"/>' +
      '<rect x="32" y="92" width="24" height="20" opacity=".9"/><rect x="64" y="90" width="42" height="22" opacity=".6"/><rect x="112" y="95" width="22" height="17" opacity=".85"/></g>' +
      '<g fill="none" stroke="#052B63" stroke-opacity=".35" stroke-width="2"><path d="M42 22v20M115 19v23M44 55v22M44 92v20M85 90v22"/></g>' +
      '<rect class="ik-beam" x="10" y="12" width="140" height="3" fill="#9BE15D" opacity=".95"/><rect class="ik-beam" x="10" y="15" width="140" height="10" fill="#9BE15D" opacity=".14"/></svg>',
    label: '<svg class="ik-art" viewBox="0 0 160 120" aria-hidden="true"><rect x="16" y="20" width="128" height="80" fill="#fff"/>' +
      '<text x="28" y="44" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="17" fill="#052B63">A-01-02</text>' +
      '<g fill="#052B63"><rect x="28" y="54" width="3" height="34"/><rect x="34" y="54" width="1.5" height="34"/><rect x="38" y="54" width="4" height="34"/><rect x="45" y="54" width="2" height="34"/>' +

      '<g class="ik-bob"><path d="M128 2c-6.6 0-12 5.4-12 12 0 8.4 12 18 12 18s12-9.6 12-18C140 7.4 134.6 2 128 2z" fill="#9BE15D"/><circle cx="128" cy="14" r="4.5" fill="#052B63"/></g></svg>'
  };
  var HEROES = {
